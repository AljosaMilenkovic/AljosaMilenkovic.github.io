description: |
  <img src="./ja.jpg" alt="Aljoša Milenković" style="max-width:200px;border-radius:0;margin:0 auto 1em;display:block;">

  Welcome! I am a visiting assistant professor of linguistics at the University of Southern California. I received my PhD from Harvard University. I work in phonology, computational and corpus linguistics, historical linguistics, and dialectology. My research examines probabilistic patterns in language and poetic meter and cumulative interactions between phonological factors. I analyze corpus data and conduct experiments to build more empirically grounded formal models of phonology. My dissertation, <a href="https://drive.google.com/file/d/16WVKrxX4ik8ZGyItWTUsOxF3NOGTEExV/view?usp=share_link" target="_blank" rel="noopener"><em>Metrical Grammar: Variation, gradience, and cumulativity at the syntax-phonology interface</em></a> (supervised by <a href="https://meluhha.com/index.html" target="_blank" rel="noopener">Kevin Ryan</a>), brings together my longstanding interest in poetry and philology with my training in formal, computational, and statistical approaches to linguistics.

  Contact: milenkov [at] usc [dot] edu.



